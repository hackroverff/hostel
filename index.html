      var bytes = new Uint8Array(salt.match(/.{1,2}/g).map(function (h) { return parseInt(h, 16); }));
      var key = await subtle.importKey('raw', enc.encode(String(value)), { name: 'PBKDF2' }, false, ['deriveBits']);
      var bits = await subtle.deriveBits({ name: 'PBKDF2', salt: bytes, iterations: 60000, hash: 'SHA-256' }, key, 256);
      return { algo: 'pbkdf2', hash: hexFromBytes(new Uint8Array(bits)) };
    } catch (e) { /* fall through to the simple hash */ }
  }
  return { algo: 'xfnv', hash: fallbackHash(String(value), salt) };
}
async function verifyLocalPassword(password, rec) {
  if (!rec) return false;
  var first = await hashSecret(password, rec.salt, rec.algo);
  if (first.hash === rec.hash) return true;
  if (first.algo !== rec.algo) {
    var fb = await hashSecret(password, rec.salt, 'xfnv');
    if (fb.hash === rec.hash) return true;
  }
  return false;
}

/* --- HTTP --------------------------------------------------------------- */
function httpJSON(url, opts, ms) {
  var options = Object.assign({ headers: {} }, opts || {});
  var fetcher = (typeof window.fetch === 'function') ? window.fetch.bind(window) : null;
  if (!fetcher) return Promise.reject(new Error('This browser cannot reach the internet'));
  return new Promise(function (resolve, reject) {
    var timer = null, controller = null, done = false;
    if (typeof AbortController === 'function') controller = new AbortController();
    if (controller && !options.signal) options.signal = controller.signal;
    if (ms) {
      timer = setTimeout(function () {
        if (done) return;
        done = true;
        if (controller) { try { controller.abort(); } catch (e) {} }
        var err = new Error('The internet is slow. Saved locally.');
        err.timeout = true;
        reject(err);
      }, ms);
    }
    function finish(fn, value) {
      if (done) return;
      done = true;
      if (timer) clearTimeout(timer);
      fn(value);
    }
    fetcher(url, options).then(function (res) {
      return res.text().then(function (body) {
        var data = null;
        try { data = body ? JSON.parse(body) : null; } catch (e) { data = null; }
        if (!res.ok) {
          var msg = (data && (data.msg || data.error_description || data.error || data.message || data.hint || data.details)) || ('Request failed (' + res.status + ')');
          var err = new Error(msg);
          err.status = res.status;
          finish(reject, err);
          return null;
        }
        finish(resolve, data);
        return null;
      });
    }, function (err) {
      var e2 = new Error('Cannot reach the cloud. Saved locally.');
      e2.offline = true;
      e2.cause = err;
      finish(reject, e2);
    }).catch(function (err) { finish(reject, err); });
  });
}
function cloudHeaders(extra) {
  return Object.assign({
    apikey: cloud.config.key,
    Authorization: 'Bearer ' + ((session && session.access_token) || cloud.config.key),
    'Content-Type': 'application/json'
  }, extra || {});
}
function cloudEmailFor(username) {
  var u = String(username || '').trim().toLowerCase();
  if (u.indexOf('@') === -1) u += '@' + (cloud.config.domain || 'hostel.local');
  return u;
}
function shortUsername(email) {
  var e = String(email || '');
  return e.replace(new RegExp('@' + (cloud.config.domain || 'hostel.local').replace(/\./g, '\\.') + '$', 'i'), '') || e;
}
function sessionName() {
  if (!session) return 'Not signed in';
  return session.user.username || session.user.email || 'Owner';
}

/* --- sign in / sign up --------------------------------------------------- */
function sessionFromAuth(json) {
  var user = (json && json.user) || {};
  return {
    v: 1,
    cloud: true,
    access_token: json.access_token || '',
    refresh_token: json.refresh_token || '',
    expires_at: Date.now() + (num(json.expires_in) || 3600) * 1000,
    user: { id: user.id || '', email: user.email || '', username: shortUsername(user.email || '') }
  };
}
async function localSignup(username, password) {
  if (readAccount()) throw new Error('This device already has an account. Sign in instead.');
  var salt = randomSalt();
  var made = await hashSecret(password, salt);
  var rec = { v: 1, username: String(username).toLowerCase(), algo: made.algo, salt: salt, hash: made.hash, at: new Date().toISOString() };
  if (!writeAccount(rec)) throw new Error('This browser could not save the account. Check storage settings.');
  return { v: 1, cloud: false, stay: true, user: { id: 'local', username: rec.username, email: '' } };
}
async function localSignin(username, password) {
  var rec = readAccount();
  if (!rec) throw new Error('No account on this device yet. Create one below.');
  if (rec.username && rec.username !== String(username).trim().toLowerCase()) throw new Error('That is not the account on this device.');
  var good = await verifyLocalPassword(password, rec);
  if (!good) throw new Error('Incorrect password. Try again.');
  return { v: 1, cloud: false, stay: true, user: { id: 'local', username: rec.username, email: '' } };
}
async function signInWithPassword(username, password, stay) {
  if (!cloud.config.configured) {
    var local = await localSignin(username, password);
    local.stay = !!stay;
    return local;
  }
  var json = await httpJSON(cloud.config.url + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { apikey: cloud.config.key, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: cloudEmailFor(username), password: String(password) })
  }, 20000);
  if (!json || !json.access_token) throw new Error('Could not sign in. Check your username and password.');
  var s = sessionFromAuth(json);
  s.stay = !!stay;
  return s;
}
async function signUpWithPassword(username, password, stay) {
  if (!cloud.config.configured) {
    var local = await localSignup(username, password);
    local.stay = !!stay;
    return local;
  }
  var json = await httpJSON(cloud.config.url + '/auth/v1/signup', {
    method: 'POST',
    headers: { apikey: cloud.config.key, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: cloudEmailFor(username), password: String(password) })
  }, 20000);
  if (json && json.access_token) {
    var s = sessionFromAuth(json);
    s.stay = !!stay;
    return s;
  }
  var pending = new Error('Account created. Check your email to confirm it, then sign in.');

}
async function refreshSessionToken() {
  if (!session || !session.cloud || !session.refresh_token) return false;
  try {
    var json = await httpJSON(cloud.config.url + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { apikey: cloud.config.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    }, 15000);
    if (json && json.access_token) {

async function ensureToken() {

}

/* --- cloud data ---------------------------------------------------------- */
function cloudRowUrl() {
  return cloud.config.url + '/rest/v1/' + encodeURIComponent(cloud.config.table) +
    '?user_id=eq.' + encodeURIComponent(session.user.id) + '&select=data,updated_at';
}
async function cloudGet() {
  await ensureToken();
  var rows = await httpJSON(cloudRowUrl(), { method: 'GET', headers: cloudHeaders() }, 15000);
  if (!Array.isArray(rows) || !rows.length) return null;
  return rows[0];
}

  await ensureToken();
  var url = cloud.config.url + '/rest/v1/' + encodeURIComponent(cloud.config.table) + '?on_conflict=user_id';
  await httpJSON(url, {
    method: 'POST',
    headers: cloudHeaders({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify([{ user_id: session.user.id, data: db, updated_at: new Date().toISOString() }])
  }, 20000);

}
function setSyncStatus(status, err) {

  cloud.error = err || '';

}
function syncStatusText() {
  if (!cloud.config.configured) {
    return { label: 'Cloud sync off', hint: 'Saved on this phone only \u00B7 add Supabase keys to sync', tone: 'neutral' };
  }
  if (!session || !session.cloud) {
    return { label: 'Local account', hint: 'Data stays on this phone \u00B7 sign in with cloud to sync', tone: 'neutral' };
  }
  if (cloud.status === 'saving') return { label: 'Syncing\u2026', hint: 'Sending your latest changes', tone: 'neutral' };
  if (cloud.status === 'offline') return { label: 'Offline \u2013 saved locally', hint: 'Will sync when the internet comes back', tone: 'warn' };
  if (cloud.status === 'error') return { label: 'Not synced \u2013 saved locally', hint: (cloud.error || 'Cloud sync failed') + '', tone: 'warn' };
  if (cloud.status === 'synced') return { label: 'Synced', hint: 'All changes saved to the cloud', tone: 'good' };
  return { label: 'Cloud sync ready', hint: 'Changes sync automatically', tone: 'neutral' };
}
function syncStatusHTML() {
  var st = syncStatusText();
  var color = st.tone === 'good' ? 'var(--green)' : st.tone === 'warn' ? '#B45309' : '#64748B';
  var bg = st.tone === 'good' ? 'var(--green-bg)' : st.tone === 'warn' ? '#FFF7ED' : '#F1F5F9';
  return '<span class="si" style="background:' + bg + ';color:' + color + '">' + icon(st.tone === 'good' ? 'checkCircle' : st.tone === 'warn' ? 'alert' : 'cloud', 18) + '</span>' +
    '<span class="grow"><span class="st">' + esc(st.label) + '</span><span class="ss">' + esc(st.hint) + '</span></span>' +
    (st.tone === 'good' ? '<span class="badge paid">' + icon('check', 12) + '</span>' : '');

function refreshSyncUi() {

}
function isOnline() {
  try { return navigator.onLine !== false; } catch (e) { return true; }
}
function scheduleCloudSync() {
  if (!session || !session.cloud || !cloud.config.configured) return;
  if (cloud.applying) return;
  cloud.pending = true;
  setSyncStatus(isOnline() ? 'saving' : 'offline');
  if (cloud.timer) clearTimeout(cloud.timer);
  cloud.timer = setTimeout(function () { cloud.timer = null; syncNow(); }, 1200);
}
async function syncNow(opts) {
  opts = opts || {};
  if (!session || !session.cloud || !cloud.config.configured) return false;
  if (!isOnline()) { setSyncStatus('offline'); return false; }
  var dirty = !!(cloud.pending || cloud.timer);
  if (cloud.timer) { clearTimeout(cloud.timer); cloud.timer = null; }
  setSyncStatus('saving');
  try {
    if (opts.pull && !dirty) {
      var row = await cloudGet();
      var remoteAt = row && row.updated_at ? Date.parse(row.updated_at) : 0;
      var localAt = db.meta && db.meta.syncedAt ? Date.parse(db.meta.syncedAt) : 0;
      if (row && row.data && row.data.residents && remoteAt > localAt) {
        applyRemote(row);
        cloud.pending = false;
        setSyncStatus('synced');
        return true;
      }
    }
    await cloudPut();
    db.meta.syncedAt = new Date().toISOString();
    saveLocalOnly();
    cloud.pending = false;
    setSyncStatus('synced');
    return true;
  } catch (e) {
    cloud.pending = true;
    setSyncStatus(e.offline || e.timeout || !isOnline() ? 'offline' : 'error', e.message);
    return false;
  }
}
function applyRemote(row) {

    db.meta.syncedAt = row.updated_at || new Date().toISOString();
    saveLocalOnly();

    ui.tab = 'home';
    ui.view = { name: 'home', params: {} };

    return true;
  } catch (e) { console.warn('Save failed', e); return false; }
}

function showAuth(mode) {

}
function hideAuth() {
  authState.visible = false;

}
function authError(msg) {

async function saveLoginForm(form) {
  clearErrors(form);
  var mode = val(form, 'mode') === 'signup' ? 'signup' : 'login';
  var username = val(form, 'username');
  var passEl = form.elements['password'];
  var password = String(passEl ? passEl.value : '');
  var stayEl = form.elements['stay'];
  var stay = stayEl ? !!stayEl.checked : true;
  var ok = true;
  if (!username) ok = setError(fieldOf(form.elements['username']), 'Enter your username or email');
  if (!password) ok = setError(fieldOf(passEl), 'Enter your password');
  if (mode === 'signup') {
    if (ok && password.length < 6) ok = setError(fieldOf(passEl), 'Use at least 6 characters');
    var cfmEl = form.elements['confirm'];
    if (ok && cfmEl && cfmEl.value !== password) ok = setError(fieldOf(cfmEl), 'The passwords do not match');
  }
  if (!ok) return;
  authState.username = username;
  authState.error = '';
  authState.notice = '';
  authState.busy = true;
  renderAuth();
  try {
    var next = mode === 'signup' ? await signUpWithPassword(username, password, stay) : await signInWithPassword(username, password, stay);
    await startSession(next);
  } catch (err) {
    if (err && err.needsConfirm) {
      authState.mode = 'login';
      authState.notice = err.message;
      authState.busy = false;
      renderAuth();
      return;
    }
    authError(err && err.message ? err.message : 'Could not sign in. Please try again.');
  }
}
async function startSession(next) {
  session = next;
  if (session.cloud) session.stay = !!session.stay;
  writeSession(session);
  authState.busy = false;
  hideAuth();
  applyUiPrefs();
  render();
  window.scrollTo(0, 0);
  if (!session.cloud) {
    setSyncStatus('local');
    toast('Signed in \u00B7 ' + (cloud.config.configured ? 'local account' : 'saved on this phone'), 'good');
    return;
  }
  var previousOwner = readCacheOwner();
  if (previousOwner && previousOwner !== session.user.id) {
    // A different account was cached on this device: never upload its data.
    db = blankDB();
    ensureBedsForRooms(db);
    reconcileBeds();
    saveLocalOnly();
    render();
  }
  writeCacheOwner(session.user.id);
  setSyncStatus('saving');
  try {
    var row = await cloudGet();
    if (row && row.data && Array.isArray(row.data.residents)) {
      applyRemote(row);
      setSyncStatus('synced');
      toast('Loaded your hostel data from the cloud', 'good');
    } else {
      await cloudPut();
      db.meta.syncedAt = new Date().toISOString();
      saveLocalOnly();
      cloud.pending = false;
      setSyncStatus('synced');
      toast('Your hostel data is now saved to the cloud', 'good');
    }
  } catch (e) {
    setSyncStatus(e.offline || e.timeout || !isOnline() ? 'offline' : 'error', e.message);
    toast('Signed in \u00B7 offline, using data on this phone', 'bad');
  }
}
function signOutNow() {
  var wasCloud = !!(session && session.cloud);
  if (wasCloud) {
    var token = session.access_token;
    try {
      httpJSON(cloud.config.url + '/auth/v1/logout', {
        method: 'POST',
        headers: { apikey: cloud.config.key, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: '{}'
      }, 6000).catch(function () {});
    } catch (e) {}
  }
  if (cloud.timer) { clearTimeout(cloud.timer); cloud.timer = null; }
  cloud.pending = false;
  forgetSession();
  authState.mode = authInitialMode();
  authState.username = '';
  ui.tab = 'home';
  ui.view = { name: 'home', params: {} };
  showAuth();
  toast('Signed out', 'good');
}
async function forgotPasswordFlow() {
  if (!cloud.config.configured) {
    askConfirm({
      title: 'Forgot your password?',
      icon: 'key',
      message: 'This device has a local account and there is no password reset.<br><br>If you still have the app open on another phone, the data is there. Otherwise create a new account \u2014 your hostel data stays on this phone.',
      confirmLabel: 'Create a new account',
      danger: false,
      onYes: function () {
        clearAccount();
        closeConfirm();
        showAuth('signup');
        toast('Choose a new username and password', 'good');
      }
    });
    return;
  }
  var email = (authState.username || '').indexOf('@') >= 0 ? authState.username : '';
  if (!email) {
    authError('Type your email above, then tap Forgot password again.');
    return;
  }
  try {
    await httpJSON(cloud.config.url + '/auth/v1/recover', {
      method: 'POST',
      headers: { apikey: cloud.config.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    }, 15000);
    authState.notice = 'Password reset link sent to ' + email + '. Check your inbox.';
    authState.error = '';
    renderAuth();
  } catch (e) {
    authError(e.message || 'Could not send the reset email.');
  }
}
function initAuth() {
  cloud.config = readCloudConfig();
  session = readSession();
  if (!session) {
    authState.mode = authInitialMode();
    showAuth(authState.mode);
    setSyncStatus(cloud.config.configured ? 'offline' : 'local');
    return;
  }
  hideAuth();
  setSyncStatus(session.cloud ? 'saving' : 'local');
  if (session.cloud) {
    // Read the cache straight away, then reconcile with the cloud.
    syncNow({ pull: true }).then(function (ok) {
      if (!ok && !isOnline()) setSyncStatus('offline');
    });
  }
}
function refreshAuthOnShow() {
  if (!session) return;
  if (session.cloud && session.expires_at && session.expires_at - Date.now() < 120000) refreshSessionToken();
  if (session.cloud && cloud.config.configured && isOnline() && !cloud.timer) syncNow({ pull: true });
}

    // never hijack a phone/WhatsApp link; just mark reminders as sent

  var id = el.getAttribute('data-id');

          title: 'Delete room ' + room.number + '?',

          confirmLabel: 'Delete room',

            db.rooms = db.rooms.filter(function (r) { return r.id !== room.id; });

        ta.value = ta.value.slice(0, start) + token + ta.value.slice(end);
        ta.focus();
        ta.selectionStart = ta.selectionEnd = start + token.length;
        var prev = $('#tplPreview');
        if (prev) prev.textContent = previewTemplate(ta.value, db.settings.upi);
        break;
      }
      default:
        break;
    }
  } catch (err) {
    console.error('Action failed: ' + act, err);
    toast('Something went wrong. Please try again.', 'bad');
  }
});

document.addEventListener('submit', function (e) {
  var form = e.target;
  if (!form || !form.getAttribute || !form.getAttribute('data-form')) return;
  e.preventDefault();
  var kind = form.getAttribute('data-form');
  try {
    if (kind === 'room') saveRoomForm(form);
    else if (kind === 'resident') saveResidentForm(form);
    else if (kind === 'payment') savePaymentForm(form);
    else if (kind === 'expense') saveExpenseForm(form);
    else if (kind === 'vacate') saveVacateForm(form);
    else if (kind === 'settings') saveSettingsForm(form);
    else if (kind === 'hostelSettings') saveHostelSettings(form);
    else if (kind === 'elecBill') saveElecBillForm(form);
    else if (kind === 'electricity') saveElectricityForm(form);
    else if (kind === 'login') saveLoginForm(form);
  } catch (err) {
    console.error('Form save failed', err);
    toast('Could not save. Please check the details.', 'bad');
  }
});

document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'resSearch') {
    ui.resQuery = e.target.value;
    var list = $('#resList');
    if (list) list.innerHTML = residentListHTML();
  }
});

document.addEventListener('change', function (e) {
  if (e.target && e.target.getAttribute && e.target.getAttribute('data-act-change') === 'elec-prop') {
    openSheet('elecBill', { month: ui.payMonth, propId: e.target.value });
    return;
  }
  var el = e.target;
  if (!el || !el.getAttribute) return;
  var change = el.getAttribute('data-act-change');
  if (el.id === 'restoreFile' || el.id === 'lockRestoreFile') {
    var file = el.files && el.files[0];
    el.value = '';
    if (file) handleRestoreFile(file);
    return;
  }
  if (!change) return;
  if (change === 'rep-prop') { ui.report.prop = el.value; render(); }
  else if (change === 'rep-year') { ui.report.year = Number(el.value); render(); }
  else if (change === 'rep-month') { ui.report.month = Number(el.value); render(); }
  else if (change === 'wiz-prop') {
    captureWizard();
    ui.wizard.data.propertyId = el.value;
    ui.wizard.data.roomId = '';
    ui.wizard.data.bedId = '';
    ui.wizard.data.rent = propertyRent(el.value);
    ui.wizard.data.depositAmount = propertyAdvance(el.value);
    renderSheet();
  } else if (change === 'wiz-room') {
    captureWizard();
    ui.wizard.data.roomId = el.value;
    ui.wizard.data.bedId = '';
    var room = roomById(el.value);
    if (room && (!ui.wizard.data.rent || num(ui.wizard.data.rent) === 0)) ui.wizard.data.rent = room.rent;
    renderSheet();
  } else if (change === 'wiz-photo') {
    var f = el.files && el.files[0];
    if (!f) return;
    captureWizard();
    readPhoto(f, function (dataUrl) {
      if (!dataUrl) { toast('Could not read that photo.', 'bad'); return; }
      ui.wizard.data.photo = dataUrl;
      renderSheet();
    });
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if (ui.confirm) closeConfirm();
    else if (ui.sheet) closeSheet();
  }
});

function copyText(txt) {
  if (!txt) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () {
        toast('Message copied', 'good');
      }, function () { legacyCopy(txt); });
      return;
    }
  } catch (e) {}
  legacyCopy(txt);
}
function legacyCopy(txt) {
  try {
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('Message copied', 'good');
  } catch (e) {
    toast('Could not copy. Please select the text manually.', 'bad');
  }
}

/* photo: shrink to a small data URL so storage stays light */
function readPhoto(file, cb) {
  try {
    if (!/^image\//.test(file.type)) { cb(null); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        try {
          var max = 320;
          var w = img.width, h = img.height;
          var scale = Math.min(1, max / Math.max(w, h));
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(w * scale));
          canvas.height = Math.max(1, Math.round(h * scale));
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          cb(canvas.toDataURL('image/jpeg', 0.72));
        } catch (err) { console.warn(err); cb(null); }
      };
      img.onerror = function () { cb(null); };
      img.src = reader.result;
    };
    reader.onerror = function () { cb(null); };
    reader.readAsDataURL(file);
  } catch (e) {
    console.warn(e);
    cb(null);
  }
}

/* room form save (kept here so the submit handler stays compact) */
function saveRoomForm(form) {
  clearErrors(form);
  var id = val(form, 'id');
  var number = val(form, 'number');
  var propertyId = val(form, 'propertyId');
  var rent = parseAmount(val(form, 'rent'));
  var bedsN = Math.round(num(val(form, 'beds')));
  var sharing = Math.round(num(val(form, 'sharing')));
  var floor = Math.round(num(val(form, 'floor')));
  if (!sharing || sharing < 1) sharing = Math.min(12, bedsN || 1);
  var ac = val(form, 'ac') || 'Non-AC';
  var ok = true;
  if (!number) ok = setError(fieldOf(form.elements['number']), 'Enter a room number');
  if (!bedsN || bedsN < 1 || bedsN > 12) ok = setError(fieldOf(form.elements['beds']), 'Beds must be between 1 and 12');
  if (!rent || rent <= 0) ok = setError(fieldOf(form.elements['rent']), 'Enter the rent per bed');
  if (!ok) return;
  var duplicate = db.rooms.filter(function (r) {
    return r.propertyId === propertyId && String(r.number).toLowerCase() === number.toLowerCase() && r.id !== id;
  })[0];
  if (duplicate) { setError(fieldOf(form.elements['number']), 'This room number is already used'); return; }

  if (id) {
    var room = roomById(id);
    if (!room) return;
    var occupiedBeds = bedsOfRoom(room.id).filter(function (b) { return !!residentAtBed(b.id); }).length;
    if (bedsN < occupiedBeds) {
      setError(fieldOf(form.elements['beds']), 'This room has ' + plural(occupiedBeds, 'resident') + '. Vacate first.');
      return;
    }
    Object.assign(room, { number: number, propertyId: propertyId, floor: floor, sharing: sharing, beds: bedsN, rent: rent, ac: ac });
    db.beds.forEach(function (b) { if (b.roomId === room.id) b.roomId = room.id; });
    // residents on removed beds get detached
    ensureBedsForRooms(db);
    var validBedIds = bedsOfRoom(room.id).map(function (b) { return b.id; });
    db.residents.forEach(function (r) {
      if (r.roomId === room.id && r.bedId && validBedIds.indexOf(r.bedId) < 0) { r.bedId = ''; }
    });
    // moving a room to another hostel moves its residents too
    db.residents.forEach(function (r) { if (r.roomId === room.id) r.propertyId = propertyId; });
  } else {
    var newRoom = { id: uid('room'), propertyId: propertyId, number: number, floor: floor, sharing: sharing, beds: bedsN, rent: rent, ac: ac };
    db.rooms.push(newRoom);
    ensureBedsForRooms(db);
  }
  reconcileBeds();
  save();
  closeSheet();
  render();
  toast(id ? 'Room updated' : 'Room added', 'good');
}

/* ===========================================================================
   28. Toast + init
   =========================================================================== */
var toastTimer = null;
function toast(msg, kind) {
  var el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () {
    el.className = 'toast' + (kind ? ' ' + kind : '');
  }, 3200);
}

var swReloaded = false;
function setupSWUpdates() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  var hadController = !!navigator.serviceWorker.controller;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      if (reg.waiting && navigator.serviceWorker.controller) {
        try { reg.waiting.postMessage('SKIP_WAITING'); } catch (e) {}
      }
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            try { nw.postMessage('SKIP_WAITING'); } catch (e) {}
          }
        });
      });
    }).catch(function (e) { console.warn('SW not registered', e); });
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (swReloaded) return;
      swReloaded = true;
      if (!hadController) { hadController = true; return; } // first install, nothing to announce
      toast('Updated to latest version', 'good');
    });
  });
}
function setupSessionWatch() {
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') refreshAuthOnShow();
  });
  window.addEventListener('online', function () {
    if (session && session.cloud) syncNow({ pull: true });
  });
  window.addEventListener('offline', function () {
    if (session && session.cloud) setSyncStatus('offline');
  });
  window.addEventListener('pagehide', function () {
    if (session && session.cloud && cloud.pending) {
      try { cloudPut(); } catch (e) {}
    }
  });
}

function init() {
  loadDB();
  ensureBedsForRooms(db);
  reconcileBeds();
  ensureDues();
  try { save(); } catch (e) {}
  ui.tab = 'home';
  ui.view = { name: 'home', params: {} };
  ui.payMonth = thisMonth();
  ui.report.year = new Date().getFullYear();
  ui.report.month = new Date().getMonth() + 1;
  applyUiPrefs();
  render();
  requestPersistentStorage();
  setupSWUpdates();
  setupSessionWatch();
  initAuth();
}

init();

})();
